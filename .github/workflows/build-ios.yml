name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package app
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          cd dist
          zip -r ../roomrental-ios-unsigned.zip Payload

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomrental-ios-unsigned
          path: roomrental-ios-unsigned.zip
          if-no-files-found: error
